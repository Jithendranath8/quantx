# QuantX frontend — nginx configuration for the production image.
#
# This file did not exist, so the Dockerfile's `COPY nginx.conf` failed and the
# frontend image could not be built at all. Without it there is also no /api
# proxy in production: the Vite dev-server proxy only runs during development,
# so every request to the API base path would 404 once deployed.

# Docker's embedded DNS server. Resolving through it on a short TTL is what
# keeps the proxy working across backend restarts.
#
# An `upstream { server backend:8000; }` block resolves the name ONCE at nginx
# startup and caches the container IP forever. The moment the backend container
# is recreated it gets a new IP, and nginx keeps dialling the dead one --
# every API call returns 502 until nginx itself is restarted. Using a variable
# in proxy_pass forces per-request resolution instead.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    # Also bind IPv6. Without this, anything resolving `localhost` to ::1
    # inside the container -- including the image's own healthcheck -- gets
    # connection refused while the site is perfectly healthy over IPv4.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ── API proxy ────────────────────────────────────────────────────
    location /api/ {
        # The variable is what makes nginx re-resolve; $request_uri preserves
        # the full path and query string, which a variable proxy_pass drops.
        set $api_backend "http://backend:8000";
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── WebSocket gateway ────────────────────────────────────────────
    location /ws/ {
        set $ws_backend "http://backend:8000";
        proxy_pass $ws_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Live streams are long-lived; do not cut them off at the default 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static assets ────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    # index.html must never be cached, or clients keep loading an old bundle
    # that references asset filenames which no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
