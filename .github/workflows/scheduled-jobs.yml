name: Scheduled jobs

# Free stand-in for an always-on Celery worker: GitHub's scheduler pokes the
# deployed API's cron endpoint, which runs the same maintenance coroutines the
# Celery beat schedule would. Requires two repository secrets:
#   DEPLOY_URL    e.g. https://quantx-api.onrender.com   (no trailing slash)
#   CRON_SECRET   must equal the backend's CRON_SECRET env var
#
# GitHub's minimum cron granularity is 5 minutes, and scheduled runs can lag
# under load — fine for a portfolio demo. Trigger manually from the Actions tab
# via "Run workflow".

on:
  schedule:
    - cron: "*/5 * * * *" # frequent upkeep
    - cron: "30 3 * * *" # nightly housekeeping
  workflow_dispatch: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

permissions: {}

jobs:
  frequent:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run frequent jobs
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          # The cron secret is sent to this URL, so it must be the real,
          # TLS-protected deployment and nothing else.
          case "$DEPLOY_URL" in
            https://*) ;;
            *) echo "DEPLOY_URL must start with https://" >&2; exit 1 ;;
          esac
          for job in paper_fills reconcile market_sync; do
            echo "→ $job"
            # Only the status code is printed. Job responses can list other
            # users' orders, and Actions logs are readable by every collaborator.
            code=$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' -X POST \
              "$DEPLOY_URL/api/v1/internal/jobs/$job" \
              -H "X-Cron-Secret: $CRON_SECRET") || code="curl-error"
            echo "  status: $code"
            # A failed job does not stop the others, but it is flagged on the run.
            case "$code" in
              2*) ;;
              *) echo "::warning::$job returned $code" ;;
            esac
          done

  nightly:
    if: github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run nightly jobs
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          # The cron secret is sent to this URL, so it must be the real,
          # TLS-protected deployment and nothing else.
          case "$DEPLOY_URL" in
            https://*) ;;
            *) echo "DEPLOY_URL must start with https://" >&2; exit 1 ;;
          esac
          for job in settle_ai derivatives_snapshot prune cleanup_tokens; do
            echo "→ $job"
            # Only the status code is printed. Job responses can list other
            # users' orders, and Actions logs are readable by every collaborator.
            code=$(curl -sS --max-time 120 -o /dev/null -w '%{http_code}' -X POST \
              "$DEPLOY_URL/api/v1/internal/jobs/$job" \
              -H "X-Cron-Secret: $CRON_SECRET") || code="curl-error"
            echo "  status: $code"
            # A failed job does not stop the others, but it is flagged on the run.
            case "$code" in
              2*) ;;
              *) echo "::warning::$job returned $code" ;;
            esac
          done
