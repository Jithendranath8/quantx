name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# Nothing in this workflow is allowed to swallow a failure. Every step that
# previously ended in `|| true` now fails the build, which is the only reason
# a pipeline is worth running.

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantx
          POSTGRES_PASSWORD: quantx_ci_password
          POSTGRES_DB: quantx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: quantx
      POSTGRES_PASSWORD: quantx_ci_password
      POSTGRES_DB: quantx
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: ci-secret-key-that-is-very-long-and-secure-1234567890
      JWT_SECRET_KEY: ci-jwt-secret-key-that-is-very-long-and-secure-1234567890
      APP_ENV: development
      RATE_LIMIT_ENABLED: "false"
      MARKET_STREAM_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check .

      - name: Create test database
        run: |
          PGPASSWORD=quantx_ci_password psql -h localhost -U quantx -d quantx \
            -c "CREATE DATABASE quantx_test;"

      - name: Verify migrations apply and reverse cleanly
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run unit & integration tests
        working-directory: backend
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` is exact and reproducible; it needs the committed lockfile.
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The frontend image could not be built at all (missing nginx.conf and no
      # lockfile for `npm ci`), and nothing in CI would have noticed.
      - name: Build backend image
        run: docker build --target production -t quantx-backend:ci ./backend

      - name: Build frontend image
        run: docker build --target production -t quantx-frontend:ci ./frontend

  # Security gates. These fail the build on a known-vulnerable dependency, a
  # committed secret, or a dangerous construct, so a regression is caught in
  # review instead of in an audit.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static security lint (backend)
        # Dangerous constructs: shell and SQL built from strings, eval/exec,
        # pickle, weak hashes, TLS verification off, requests without timeouts.
        # The ignored rules are false positives for this codebase (placeholder
        # constants, the bind address, pytest asserts).
        run: |
          pip install ruff
          ruff check backend/app --select S --ignore S101,S104,S105,S106,S110,S311,S607

      - name: Known vulnerabilities in backend dependencies
        # Audits what actually gets installed. The requirements use version
        # ranges, so auditing the file itself would mean resolving every range
        # first, which is slow and unreliable.
        run: |
          pip install -r backend/requirements.txt
          pip install pip-audit
          pip-audit --progress-spinner off

      - name: Known vulnerabilities in frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner
