# QuantX Redis — Celery broker & result backend.
#
# Deliberately separate from the cache instance. A broker must never evict:
# an evicted message is a background job that vanishes with no error anywhere.

# ----- Memory -----
maxmemory 512mb
# noeviction makes Redis reject writes when full instead of dropping queued
# tasks. A visible failure to enqueue is far better than a silent loss.
maxmemory-policy noeviction

# ----- Persistence -----
# Queued work should survive a restart, so AOF is on here.
appendonly yes
appendfsync everysec

# ----- Logging -----
loglevel notice

# ----- Security -----
protected-mode yes
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "QUANTX_CONFIG"

# ----- Performance -----
tcp-keepalive 300
timeout 0
