name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Nothing in this workflow is allowed to swallow a failure. Every step that
# previously ended in `|| true` now fails the build, which is the only reason
# a pipeline is worth running.

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantx
          POSTGRES_PASSWORD: quantx_ci_password
          POSTGRES_DB: quantx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: quantx
      POSTGRES_PASSWORD: quantx_ci_password
      POSTGRES_DB: quantx
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: ci-secret-key-that-is-very-long-and-secure-1234567890
      JWT_SECRET_KEY: ci-jwt-secret-key-that-is-very-long-and-secure-1234567890
      APP_ENV: development
      RATE_LIMIT_ENABLED: "false"
      MARKET_STREAM_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check .

      - name: Create test database
        run: |
          PGPASSWORD=quantx_ci_password psql -h localhost -U quantx -d quantx \
            -c "CREATE DATABASE quantx_test;"

      - name: Verify migrations apply and reverse cleanly
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run unit & integration tests
        working-directory: backend
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` is exact and reproducible; it needs the committed lockfile.
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The frontend image could not be built at all (missing nginx.conf and no
      # lockfile for `npm ci`), and nothing in CI would have noticed.
      - name: Build backend image
        run: docker build --target production -t quantx-backend:ci ./backend

      - name: Build frontend image
        run: docker build --target production -t quantx-frontend:ci ./frontend
