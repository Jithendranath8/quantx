# QuantX Redis Configuration
#
# IMPORTANT: this instance is only safe for caching and pub/sub.
# The Celery broker (db 1) and result backend (db 2) MUST NOT share an
# instance with an eviction policy: under memory pressure Redis would evict
# queued task messages and results, silently losing background jobs. See the
# separate `redis-broker` service in docker-compose.yml, which runs with
# maxmemory-policy noeviction.

# ----- Memory -----
maxmemory 256mb
maxmemory-policy allkeys-lru

# ----- Persistence -----
# Cache data is reconstructible, so AOF is off here to avoid the write cost.
appendonly no
save ""

# ----- Logging -----
loglevel notice

# ----- Security -----
# Set REDIS_PASSWORD in .env; docker-compose passes it through below.
# requirepass is supplied on the command line so it can come from the env.
protected-mode yes

# Dangerous commands are renamed away rather than left reachable.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "QUANTX_CONFIG"

# ----- Performance -----
tcp-keepalive 300
timeout 0
