# QuantX — response security headers for the landing page document only.
#
# Identical to security-headers.conf except that script-src also allows
# 'unsafe-eval'. The 3D scene runtime on the landing page builds functions from
# strings and does not start without it. The exception is confined to the
# document served at exactly "/": every link from that page into the app is a
# full page load, so the app itself always runs under the strict policy.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; media-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
