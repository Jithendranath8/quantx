# QuantX — response security headers, included by nginx.conf.
#
# Kept in one file because nginx does not inherit add_header into a location
# that declares its own: every location that adds a header includes this.
#
# The same policy is in public/_headers for static hosts (Cloudflare Pages).
# Keep the two in step.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
# Scripts may come only from this origin: no inline script, no eval, no third
# party. The session tokens live in browser storage, so script execution is
# what has to be contained. 'wasm-unsafe-eval' permits WebAssembly only, which
# the 3D scene on the landing page needs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; media-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
