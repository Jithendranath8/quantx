# QuantX — Render Blueprint (free-tier deployment)
#
# One-provider starting point: an API web service + the static frontend. Bring
# your own managed Postgres (Neon) and Redis (Upstash) and set DATABASE_URL /
# REDIS_URL below — Render's own free datastores are size/time limited.
#
# Usage: push this file, then in Render: New → Blueprint → pick this repo.
# Fill the `sync: false` secrets in the dashboard afterwards. See DEPLOY.md.
#
# Note: Render's free web service sleeps after ~15 min idle and cold-starts in
# ~30-60s — fine for a portfolio demo.

services:
  - type: web
    name: quantx-api
    runtime: docker
    repo: # set to your Git repo URL in the dashboard, or leave for auto-detect
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Apply migrations before each deploy (uses DATABASE_URL via the sync DSN).
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: BACKEND_WORKERS
        value: "1"
      - key: MARKET_STREAM_ENABLED
        value: "false"
      - key: BINANCE_TESTNET
        value: "true"
      - key: ALLOW_MAINNET_TRADING
        value: "false"
      - key: LLM_PROVIDER
        value: auto
      # --- secrets: set these in the Render dashboard (never committed) ---
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false

  - type: web
    name: quantx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Point the SPA at the API service's public URL (set in the dashboard).
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
